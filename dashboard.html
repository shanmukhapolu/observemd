<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Sidebar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>

:root{
    --bg:#050816;
    --glass:rgba(255,255,255,.06);
    --glass2:rgba(255,255,255,.03);
    --border:rgba(255,255,255,.10);
    --text:#e5e7eb;
    --muted:#94a3b8;

    --purple:#8b5cf6;
    --cyan:#06b6d4;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:var(--bg);
    height:100vh;
    display:flex;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);

    width:72px;
    padding:12px;

    background:var(--glass);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);

    border-radius:999px;

    display:flex;
    flex-direction:column;
    gap:10px;

    transition:all .35s ease;
    overflow:hidden;
}

/* EXPAND */
.sidebar:hover{
    width:220px;
    border-radius:28px;
}

/* LOGO */
.logo{
    width:48px;
    height:48px;

    border-radius:999px;

    background:linear-gradient(135deg,var(--purple),var(--cyan));

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:600;
    color:white;

    margin-bottom:6px;
}

/* ITEM */
.item{
    display:flex;
    align-items:center;
    gap:14px;

    padding:12px;

    border-radius:999px;

    cursor:pointer;

    color:var(--muted);

    transition:.2s;
}

.item:hover{
    background:var(--glass2);
    color:white;
}

.item.active{
    background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(6,182,212,.15));
    color:white;
}

/* ICON WRAPPER */
.icon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:999px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
}

/* LABEL */
.label{
    opacity:0;
    transform:translateX(-8px);
    transition:.25s ease;
    white-space:nowrap;
    font-size:.95rem;
}

/* SHOW LABEL ON HOVER */
.sidebar:hover .label{
    opacity:1;
    transform:translateX(0);
}

/* ICON SIZE */
svg{
    width:20px;
    height:20px;
    stroke-width:1.8;
}

/* subtle glow */
.sidebar::before{
    content:'';
    position:absolute;
    inset:-40px;
    background:radial-gradient(circle,rgba(139,92,246,.15),transparent 60%);
    z-index:-1;
}

</style>
</head>

<body>

<div class="sidebar">

    <div class="logo">OM</div>

    <div class="item active">
        <div class="icon" data-lucide="layout-dashboard"></div>
        <div class="label">Dashboard</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="clock"></div>
        <div class="label">Hours</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="book-open"></div>
        <div class="label">Reflections</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="bar-chart-3"></div>
        <div class="label">Analytics</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="building-2"></div>
        <div class="label">Hospitals</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="settings"></div>
        <div class="label">Settings</div>
    </div>

</div>

<script>
lucide.createIcons();

const items = document.querySelectorAll('.item');

items.forEach(item => {
    item.addEventListener('click', () => {
        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
    });
});
</script>

</body>
</html>
