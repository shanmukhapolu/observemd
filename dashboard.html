<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard • ObserveMD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script type="module" src="assets/firebase-auth.js"></script>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p>Your healthcare observation journey.</p>
      </div>
      <button class="btn" id="newObsBtn"><i data-lucide="plus"></i>New Observation</button>
    </div>

    <div class="stats-grid" id="stats"></div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head">
          <div>
            <h3>Observation Activity</h3>
            <div class="sub">Hours logged over time</div>
          </div>
          <div class="seg" id="rangeSeg">
            <button data-range="week">Weekly</button>
            <button data-range="month" class="active">Monthly</button>
            <button data-range="year">Yearly</button>
          </div>
        </div>
        <div class="chart-wrap" id="activityChart"></div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="card-head"><h3>Recent Observations</h3>
            <a href="observations.html" class="badge accent">View all</a></div>
          <div id="recent"></div>
        </div>
      </div>
    </div>

    <div class="grid-2-even" style="margin-top:16px;">
      <div class="card">
        <div class="card-head"><h3>Key Insights</h3><span class="badge cyan">Auto-generated</span></div>
        <div id="insights"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Hours by Specialty</h3></div>
        <div id="specBars"></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/app.js"></script>
<script>
(async () => {
OMD.renderSidebar("dashboard");
await OMD.init();

const a = OMD.analytics();

/* ---- Stat cards ---- */
function trend(dir, txt){
  const ic = dir==="up"?"trending-up":dir==="down"?"trending-down":"minus";
  return `<span class="trend ${dir}"><i data-lucide="${ic}"></i>${txt}</span>`;
}
// month-over-month hours
const months = a.monthsSorted;
const lastM = months[months.length-1], prevM = months[months.length-2];
const lastHrs = lastM ? OMD.round(a.byMonth[lastM]) : 0;
const prevHrs = prevM ? OMD.round(a.byMonth[prevM]) : 0;
const lastSess = lastM ? a.sessMonth[lastM] : 0;

document.getElementById("stats").innerHTML = `
  <div class="stat-card">
    <div class="stat-icon"><i data-lucide="clock"></i></div>
    <div class="stat-label">Observation Hours</div>
    <div class="stat-value">${a.totalHours}</div>
    <div class="stat-meta">${trend(lastHrs>=prevHrs?"up":"down", (lastHrs>=prevHrs?"+":"")+OMD.round(lastHrs-prevHrs)+" hrs")} this month</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon"><i data-lucide="calendar-check"></i></div>
    <div class="stat-label">Observation Sessions</div>
    <div class="stat-value">${a.sessions}</div>
    <div class="stat-meta">${trend("up","+"+lastSess)} logged this month</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon"><i data-lucide="layers"></i></div>
    <div class="stat-label">Specialties Observed</div>
    <div class="stat-value">${a.specialtiesCount}</div>
    <div class="stat-meta"><span class="trend flat"><i data-lucide="star"></i>Top: ${a.topSpec?a.topSpec[0]:"—"}</span></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon"><i data-lucide="book-open"></i></div>
    <div class="stat-label">Reflection Responses</div>
    <div class="stat-value">${a.respCount}</div>
    <div class="stat-meta">${trend("up","100%")} completion rate</div>
  </div>`;

/* ---- Activity chart ---- */
function drawActivity(range){
  let labels=[], values=[];
  if(range==="month"){
    a.monthsSorted.forEach(k=>{ labels.push(OMD.monthLabel(k)); values.push(OMD.round(a.byMonth[k])); });
  } else if(range==="year"){
    const byYear={};
    a.list.forEach(o=>{ const y=o.date.slice(0,4); byYear[y]=(byYear[y]||0)+o.hours; });
    Object.keys(byYear).sort().forEach(y=>{ labels.push(y); values.push(OMD.round(byYear[y])); });
  } else { // week - last 8 ISO weeks
    const byWeek={};
    a.list.forEach(o=>{
      const d=new Date(o.date); const onejan=new Date(d.getFullYear(),0,1);
      const wk=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
      const key=d.getFullYear()+"-W"+String(wk).padStart(2,"0");
      byWeek[key]=(byWeek[key]||0)+o.hours;
    });
    Object.keys(byWeek).sort().slice(-10).forEach(k=>{ labels.push(k.split("-")[1]); values.push(OMD.round(byWeek[k])); });
  }
  if(!values.length){ values=[0]; labels=["—"]; }
  OMD.lineChart(document.getElementById("activityChart"), labels, values, {height:280});
}
drawActivity("month");
document.getElementById("rangeSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#rangeSeg button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); drawActivity(b.dataset.range);
});

/* ---- Recent observations ---- */
document.getElementById("recent").innerHTML = a.list.slice(0,5).map(o=>`
  <div class="row">
    <div class="row-left">
      <div class="row-title">${o.specialty}</div>
      <div class="row-sub">${o.providerName} • ${o.hours} hrs</div>
    </div>
    <div class="badge">${OMD.fmtDate(o.date,{month:"short",day:"numeric"})}</div>
  </div>`).join("") || `<p style="color:var(--muted)">No observations yet.</p>`;

/* ---- Insights ---- */
const topMonthLabel = a.topMonth ? new Date(a.topMonth[0]+"-01").toLocaleDateString("en-US",{month:"long",year:"numeric"}) : "—";
const specPct = a.topSpec ? Math.round(a.topSpec[1]/a.totalHours*100) : 0;
document.getElementById("insights").innerHTML = `
  <div class="insight"><div class="insight-ic"><i data-lucide="star"></i></div>
    <div><div class="insight-title">Most Observed Specialty</div>
    <div class="insight-text"><b>${a.topSpec?a.topSpec[0]:"—"}</b> makes up ${specPct}% of your total observation hours.</div></div></div>
  <div class="insight"><div class="insight-ic"><i data-lucide="flame"></i></div>
    <div><div class="insight-title">Longest Observation Streak</div>
    <div class="insight-text">Your best run was <b>${a.bestStreak} consecutive day(s)</b> of observation.</div></div></div>
  <div class="insight"><div class="insight-ic"><i data-lucide="pen-line"></i></div>
    <div><div class="insight-title">Reflection Growth</div>
    <div class="insight-text">You've written <b>${a.totalWords.toLocaleString()} words</b>, averaging ${a.avgReflection} words per response.</div></div></div>
  <div class="insight"><div class="insight-ic"><i data-lucide="calendar-heart"></i></div>
    <div><div class="insight-title">Most Active Month</div>
    <div class="insight-text"><b>${topMonthLabel}</b> with ${a.topMonth?OMD.round(a.topMonth[1]):0} hours logged.</div></div></div>`;

/* ---- Specialty bars ---- */
const specSorted = Object.entries(a.bySpec).sort((x,z)=>z[1]-x[1]).slice(0,6);
const maxSpec = Math.max(...specSorted.map(s=>s[1]),1);
document.getElementById("specBars").innerHTML = specSorted.map(([s,h])=>`
  <div class="bar-row">
    <div class="lab">${s}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${h/maxSpec*100}%"></div></div>
    <div class="val">${OMD.round(h)}h</div>
  </div>`).join("");

document.getElementById("newObsBtn").addEventListener("click",()=>OMD.openObservationModal(()=>location.reload()));
lucide.createIcons();
})();
</script>
</body>
</html>
