<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ObserveMD Sidebar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
    --bg:#050816;
    --sidebar:rgba(255,255,255,.04);
    --border:rgba(255,255,255,.08);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --purple:#8b5cf6;
    --cyan:#06b6d4;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:var(--bg);
    min-height:100vh;
    color:var(--text);
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:16px;
    left:16px;

    width:68px;
    height:calc(100vh - 32px);

    padding:8px;

    background:var(--sidebar);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);

    border-radius:22px;

    display:flex;
    flex-direction:column;

    transition:width .3s ease;
    overflow:hidden;
}

/* EXPAND */
.sidebar:hover{
    width:220px;
}

/* BRAND */
.logo{
    height:52px;

    display:flex;
    align-items:center;

    padding:0 14px;
    margin-bottom:10px;

    font-size:1rem;
    font-weight:600;

    white-space:nowrap;
    flex-shrink:0;
}

.logo span{
    background:linear-gradient(135deg,var(--purple),var(--cyan));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* NAV ITEMS */
.item{
    height:44px;

    display:flex;
    align-items:center;
    gap:14px;

    padding:0 14px;

    border-radius:12px;

    cursor:pointer;
    color:var(--muted);

    transition:.2s ease;
}

.item:hover{
    background:rgba(255,255,255,.05);
    color:white;
}

.item.active{
    background:rgba(139,92,246,.15);
    color:white;
}

/* ICON */
.icon{
    width:20px;
    min-width:20px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* LABEL */
.label{
    opacity:0;
    width:0;

    overflow:hidden;
    white-space:nowrap;

    transition:.2s ease;

    font-size:.92rem;
    font-weight:500;
}

.sidebar:hover .label{
    opacity:1;
    width:auto;
}

/* PUSH SETTINGS DOWN */
.spacer{
    flex:1;
}

/* ICON SIZE */
svg{
    width:18px;
    height:18px;
    stroke-width:2;
}

/* SUBTLE GLOW */
.sidebar::before{
    content:"";
    position:absolute;
    inset:-80px;

    background:
        radial-gradient(
            circle at top left,
            rgba(139,92,246,.15),
            transparent 45%
        );

    z-index:-1;
}
</style>
</head>
<body>

<div class="sidebar">

    <div class="logo">
        <span>ObserveMD</span>
    </div>

    <div class="item active">
        <div class="icon" data-lucide="layout-dashboard"></div>
        <div class="label">Dashboard</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="clock-3"></div>
        <div class="label">Hours</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="book-open"></div>
        <div class="label">Reflections</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="bar-chart-3"></div>
        <div class="label">Analytics</div>
    </div>

    <div class="item">
        <div class="icon" data-lucide="building-2"></div>
        <div class="label">Hospitals</div>
    </div>

    <div class="spacer"></div>

    <div class="item">
        <div class="icon" data-lucide="settings"></div>
        <div class="label">Settings</div>
    </div>

</div>

<script>
lucide.createIcons();

const items = document.querySelectorAll('.item');

items.forEach(item => {
    item.addEventListener('click', () => {
        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
    });
});
</script>

</body>
</html>
