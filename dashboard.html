<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Sidebar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --glass:rgba(255,255,255,.06);
    --glass2:rgba(255,255,255,.03);
    --border:rgba(255,255,255,.10);
    --text:#e5e7eb;
    --muted:#94a3b8;

    --purple:#8b5cf6;
    --cyan:#06b6d4;
}

/* BASE */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:var(--bg);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

/* SIDEBAR WRAPPER */
.sidebar{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);

    width:72px;
    padding:12px;

    background:var(--glass);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);

    border-radius:999px;

    display:flex;
    flex-direction:column;
    gap:12px;

    transition:width .35s ease, border-radius .35s ease;
    overflow:hidden;
}

/* EXPAND ON HOVER */
.sidebar:hover{
    width:220px;
    border-radius:28px;
}

/* ITEM */
.item{
    display:flex;
    align-items:center;
    gap:14px;

    padding:12px;
    border-radius:999px;

    cursor:pointer;
    transition:.2s;

    color:var(--muted);
    user-select:none;
}

/* hover highlight */
.item:hover{
    background:var(--glass2);
    color:white;
}

/* ACTIVE STATE */
.item.active{
    background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(6,182,212,.15));
    color:white;
}

/* ICON */
.icon{
    min-width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:999px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);

    font-size:18px;
}

/* LABEL (HIDDEN UNTIL EXPAND) */
.label{
    opacity:0;
    transform:translateX(-10px);
    transition:.25s ease;
    white-space:nowrap;
}

/* SHOW LABEL ON HOVER */
.sidebar:hover .label{
    opacity:1;
    transform:translateX(0);
}

/* TOP LOGO DOT */
.logo{
    width:48px;
    height:48px;

    border-radius:999px;

    background:linear-gradient(135deg,var(--purple),var(--cyan));

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:700;
    color:white;

    margin-bottom:6px;
}

/* subtle glow */
.sidebar::before{
    content:'';
    position:absolute;
    inset:-40px;
    background:radial-gradient(circle,rgba(139,92,246,.15),transparent 60%);
    z-index:-1;
}

/* RIGHT DEMO CONTENT */
.content{
    text-align:center;
    opacity:.6;
}

</style>
</head>

<body>

<div class="sidebar">

    <div class="logo">OM</div>

    <div class="item active">
        <div class="icon">🏠</div>
        <div class="label">Dashboard</div>
    </div>

    <div class="item">
        <div class="icon">⏱️</div>
        <div class="label">Hours</div>
    </div>

    <div class="item">
        <div class="icon">🧠</div>
        <div class="label">Reflections</div>
    </div>

    <div class="item">
        <div class="icon">📊</div>
        <div class="label">Analytics</div>
    </div>

    <div class="item">
        <div class="icon">🏥</div>
        <div class="label">Specialties</div>
    </div>

    <div class="item">
        <div class="icon">⚙️</div>
        <div class="label">Settings</div>
    </div>

</div>

<div class="content">
    Hover sidebar → expands smoothly
</div>

<script>
const items = document.querySelectorAll('.item');

items.forEach(item => {
    item.addEventListener('click', () => {
        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
    });
});
</script>

</body>
</html>
