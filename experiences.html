<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiences • ObserveMD</title>
<link rel="icon" type="image/png" href="assets/logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><script src="https://unpkg.com/lucide@latest"></script><script type="module" src="assets/firebase-auth.js"></script>
</head>
<body><div class="app"><main class="main">
  <div class="page-header">
    <div><h1>Experiences</h1><p>Shadowing relationships and contexts, with observations nested underneath.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-ghost" href="experiences.html"><i data-lucide="arrow-left"></i>All Experiences</a><button class="btn" id="newExpBtn"><i data-lucide="plus"></i>New Experience</button></div>
  </div>
  <div id="detail"></div><div class="obs-grid" id="grid"></div>
</main></div>
<div class="modal-overlay" id="obsDetail"><div class="modal" id="obsBody"></div></div>
<div class="modal-overlay" id="verifyModal"><div class="modal" id="verifyBody"></div></div>
<script src="assets/app.js"></script>
<script>
(async()=>{
OMD.renderSidebar('experiences'); await OMD.init();
const Q=OMD.REFLECTION_QUESTIONS; const params=new URLSearchParams(location.search); let selected=params.get('id');
const badge=s=>`<span class="badge ${s==='verified'?'green':s==='pending'?'cyan':'accent'}">${s==='pending'?'Pending Verification':s==='verified'?'Verified':'Unverified'}</span>`;
const range=e=>{ if(!e.startDate&&!e.endDate) return 'No observations yet'; if(e.startDate&&e.endDate&&e.startDate!==e.endDate) return [e.startDate,e.endDate].map(d=>OMD.fmtDate(d,{month:'short',day:'numeric',year:'numeric'})).join(' – '); return OMD.fmtDate(e.startDate||e.endDate,{month:'short',day:'numeric',year:'numeric'}); };
function renderCards(){ const exps=OMD.getExperiences(); document.getElementById('detail').innerHTML=''; document.getElementById('grid').innerHTML=exps.length?exps.map(e=>`
  <div class="obs-card" data-id="${e.id}"><div class="obs-top"><div><div class="obs-spec">${e.title}</div><div class="obs-prov">${e.specialty}</div></div>${badge(e.verificationStatus)}</div>
  <div class="obs-summary">${e.organization||'—'}</div><div class="obs-foot"><span class="obs-hours"><i data-lucide="clock"></i>${e.totalHours||0} hrs</span><span class="row-sub">${e.totalObservations||0} observation${e.totalObservations!==1?'s':''}</span></div><div class="row-sub" style="margin-top:10px">${range(e)}</div></div>`).join(''):`<div class="empty" style="grid-column:1/-1"><i data-lucide="stethoscope"></i><h3>No experiences yet</h3><p>Create an experience to group shadowing sessions.</p></div>`; document.querySelectorAll('.obs-card').forEach(c=>c.onclick=()=>{selected=c.dataset.id; history.replaceState(null,'','?id='+selected); renderDetail();}); lucide.createIcons(); }
function renderDetail(){ const e=OMD.getExperience(selected); if(!e){renderCards();return;} const obs=OMD.getObservationsForExperience(e.id); const locked=e.verificationStatus==='verified'; document.getElementById('grid').innerHTML=''; document.getElementById('detail').innerHTML=`
  <div class="card" style="margin-bottom:16px"><div class="card-head"><div><h2>${e.title}</h2><div class="sub">${e.specialty} • ${e.organization||'—'} • ${range(e)}</div></div>${badge(e.verificationStatus)}</div>
  <div class="mini-grid"><div class="mini-stat"><div class="l">Total Hours</div><div class="v">${e.totalHours||0}</div></div><div class="mini-stat"><div class="l">Observations</div><div class="v">${e.totalObservations||0}</div></div><div class="mini-stat"><div class="l">Type</div><div class="v">${e.experienceType||'—'}</div></div></div>
  ${e.verificationStatus==='verified'?`<div class="reflect-resp" style="border-left-color:var(--green);margin-top:14px"><p><b>Verified By:</b> ${e.verifierName||'—'}<br><b>Title:</b> ${e.verifierTitle||'—'}<br><b>Verified On:</b> ${e.verifiedAt?new Date(e.verifiedAt).toLocaleDateString(): '—'}</p></div>`:''}
  <div class="modal-actions" style="justify-content:flex-start"><button class="btn" id="addObs" ${locked?'disabled':''}><i data-lucide="plus"></i>Add Observation</button><button class="btn btn-ghost" id="editExp" ${locked?'disabled':''}><i data-lucide="pencil"></i>Edit Experience</button><button class="btn btn-ghost" id="deleteExp" ${locked?'disabled':''} style="color:#fda4af"><i data-lucide="trash-2"></i>Delete Experience</button><button class="btn btn-ghost" id="verify"><i data-lucide="badge-check"></i>Request Verification</button></div></div>
  <div class="section-title"><span class="si"><i data-lucide="calendar-check"></i></span>Observations</div><div class="obs-grid">${obs.length?obs.map(o=>`<div class="obs-card" data-obs="${o.id}"><div class="obs-top"><div><div class="obs-spec">${OMD.fmtDate(o.date)}</div><div class="obs-prov">${o.startTime} – ${o.endTime}${o.settingType?' • '+o.settingType:''}</div></div><span class="badge accent">${o.duration||o.hours} hrs</span></div><div class="obs-summary">${o.sessionSummary||o.notes||''}</div></div>`).join(''):'<div class="empty"><i data-lucide="eye-off"></i><h3>No observations yet</h3><p>Add the first session for this experience.</p></div>'}</div>`;
  document.getElementById('addObs').onclick=()=>OMD.openObservationModal(()=>location.reload(), e);
  document.getElementById('editExp').onclick=()=>editExperience(e);
  document.getElementById('deleteExp').onclick=()=>deleteExperience(e);
  document.getElementById('verify').onclick=()=>requestVerification(e);
  document.querySelectorAll('[data-obs]').forEach(c=>c.onclick=()=>openObs(c.dataset.obs)); lucide.createIcons(); }
async function editExperience(e){ const specialty=prompt('Specialty', e.specialty||''); if(specialty===null) return; const organization=prompt('Organization / Location', e.organization||''); if(organization===null) return; await OMD.updateExperience(e.id,{specialty:specialty.trim(),organization:organization.trim(),location:organization.trim()}); OMD.toast('Experience updated'); location.reload(); }
async function deleteExperience(e){ if(!confirm('Delete this experience and all of its observations? This cannot be undone.')) return; await OMD.deleteExperience(e.id); OMD.toast('Experience deleted'); location.href='experiences.html'; }
async function requestVerification(e){ const res=await OMD.requestVerification(e.id); const overlay=document.getElementById('verifyModal'); document.getElementById('verifyBody').innerHTML=`<div class="modal-head"><div><h2>Verification Request</h2><p>Share this link or QR code with the verifier.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div><div class="field full"><label>Verification Link</label><input id="verifyLink" value="${res.url}" readonly></div><div style="display:grid;place-items:center;margin:18px 0"><img src="${res.qr}" alt="Verification QR code" style="border-radius:12px;background:#fff;padding:10px"></div><div class="modal-actions"><button class="btn btn-ghost" data-close>Close</button><button class="btn" id="copyVerify"><i data-lucide="copy"></i>Copy Link</button></div>`; overlay.classList.add('open'); overlay.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>overlay.classList.remove('open')); document.getElementById('copyVerify').onclick=async()=>{await navigator.clipboard.writeText(res.url); OMD.toast('Verification link copied');}; lucide.createIcons(); }
function openObs(id){ const o=OMD.getAll().find(x=>x.id===id); const e=OMD.getExperience(o.experienceId); const locked=e?.verificationStatus==='verified'; const overlay=document.getElementById('obsDetail'); document.getElementById('obsBody').innerHTML=`<div class="modal-head"><div><h2>${OMD.fmtDate(o.date)}</h2><p>${o.startTime} – ${o.endTime} • ${o.duration||o.hours} hrs${o.settingType?' • '+o.settingType:''}</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div><div class="reflect-resp" style="border-left-color:var(--cyan)"><p>${o.sessionSummary||o.notes||'—'}</p></div><div class="form-divider">Reflections</div>${Q.map((q,i)=>`<div class="field full"><label>${i+1}. ${q}</label><div class="reflect-resp"><p>${(o.reflections||{})[i]||'—'}</p></div></div>`).join('')}<div class="modal-actions"><button class="btn btn-ghost" id="editObs" ${locked?'disabled':''}><i data-lucide="pencil"></i>Edit Observation</button><button class="btn btn-ghost" id="delObs" ${locked?'disabled':''} style="color:#fda4af"><i data-lucide="trash-2"></i>Delete Observation</button><button class="btn" data-close>Close</button></div>`; overlay.classList.add('open'); overlay.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>overlay.classList.remove('open')); document.getElementById('editObs').onclick=async()=>{ const summary=prompt('Session summary', o.sessionSummary||o.notes||''); if(summary===null) return; await OMD.updateObservation(o.id,{notes:summary.trim(),sessionSummary:summary.trim()}); OMD.toast('Observation updated'); location.reload(); }; document.getElementById('delObs').onclick=async()=>{ if(!confirm('Delete this observation?')) return; await OMD.remove(o.id); OMD.toast('Observation deleted'); location.reload(); }; lucide.createIcons(); }
document.getElementById('newExpBtn').onclick=()=>OMD.openExperienceModal(exp=>{location.href='experiences.html?id='+exp.id}); selected?renderDetail():renderCards();
})();
</script></body></html>
