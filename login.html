<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ObserveMD &bull; Sign In</title>
<link rel="icon" type="image/png" href="assets/logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --paper:#f7f8f6; --surface:#fff; --ink:#17232d; --muted:#5d6a72; --line:#dce2df; --accent:#27685d; --accent-dark:#1d5148; --soft:#eaf1ed; }
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; display:flex; font-family:'DM Sans',sans-serif; color:var(--ink); background:var(--paper); overflow-x:hidden; -webkit-font-smoothing:antialiased; }
.logo { position:absolute; top:28px; left:36px; font-size:1.18rem; font-weight:700; letter-spacing:-.04em; }
.logo span { color:var(--accent); }
.left { flex:1; display:flex; flex-direction:column; justify-content:center; padding:clamp(40px,7vw,110px); }
.left h1 { font-family:'Source Serif 4',Georgia,serif; font-size:clamp(3rem,5vw,4.6rem); font-weight:500; line-height:1.05; letter-spacing:-.035em; max-width:540px; margin-bottom:22px; }
.left h1 span { color:var(--accent); }
.left p { color:var(--muted); font-size:1.06rem; line-height:1.8; max-width:470px; }
.features { margin-top:30px; display:flex; flex-direction:column; gap:12px; color:var(--ink); }
.feature { display:flex; align-items:flex-start; gap:10px; }
.feature::before { content:"✓"; color:var(--accent); font-weight:700; }
.right { width:min(520px,48%); display:flex; flex-direction:column; justify-content:center; padding:clamp(32px,5vw,76px); border-left:1px solid var(--line); background:var(--surface); }
.right h2 { font-family:'Source Serif 4',Georgia,serif; font-size:2.25rem; font-weight:500; letter-spacing:-.03em; margin-bottom:8px; }
.right > p { color:var(--muted); margin-bottom:28px; font-size:.94rem; }
.right > p a { color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
input { display:block; width:100%; height:50px; margin-bottom:12px; padding:0 14px; border-radius:5px; border:1px solid #cfd8d3; background:#fff; color:var(--ink); font:inherit; outline:none; transition:border-color .18s,box-shadow .18s; }
input::placeholder { color:#7b8782; }
input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(39,104,93,.12); }
.btn { width:100%; min-height:49px; margin-top:5px; padding:0 18px; border:1px solid var(--accent); border-radius:5px; background:var(--accent); color:white; font:600 .96rem 'DM Sans',sans-serif; cursor:pointer; transition:background .18s,border-color .18s; }
.btn:hover { background:var(--accent-dark); border-color:var(--accent-dark); }
.btn:disabled { opacity:.6; cursor:not-allowed; }
.forgot { display:block; text-align:right; margin:0 0 10px auto; font-size:.85rem; color:var(--accent); cursor:pointer; background:none; border:none; text-decoration:underline; text-underline-offset:3px; }
.divider { display:flex; align-items:center; margin:0 0 18px; color:var(--muted); font-size:.82rem; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--line); }
.divider span { padding:0 12px; }
#loginGate { position:fixed; inset:0; z-index:99; background:var(--paper); display:grid; place-items:center; transition:opacity .25s; }
@keyframes spin { to { transform:rotate(360deg); } }
@media(max-width:900px) {
 body { flex-direction:column; }
 .left { display:none; }
 .right { width:100%; min-height:100vh; border-left:none; padding:100px 28px 36px; }
 .logo { left:28px; top:25px; }
}
</style>
</head>
<body>

<!-- Auth check gate: hides flicker while we confirm logged-out state -->
<div id="loginGate">
  <div style="width:40px;height:40px;border-radius:50%;border:3px solid #dce2df;border-top-color:#27685d;animation:spin .8s linear infinite;"></div>
</div>

<div class="logo">Observe<span>MD</span></div>

<div class="left">
  <h1>Welcome back.</h1>
  <p>Continue tracking your clinical experiences, shadowing hours, and reflections — right where you left off.</p>
</div>

<div class="right">
  <h2>Sign in</h2>
  <p>Don&#39;t have an account? <a href="signup.html">Create one</a></p>

  <div class="divider"><span>email &amp; password</span></div>

  <form id="loginForm">
    <input type="email"    id="emailIn" placeholder="Email address" required>
    <input type="password" id="passIn"  placeholder="Password"      required>
    <button type="button" class="forgot" id="forgotBtn">Forgot password?</button>
    <button class="btn" type="submit" id="submitBtn">Sign in</button>
  </form>
</div>

<script type="module">
import { auth }                from "./assets/firebase.js";
import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const gate = document.getElementById("loginGate");

// If already authenticated, skip login page entirely
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.replace("dashboard.html");
  } else {
    gate.style.opacity = "0";
    setTimeout(() => gate.remove(), 280);
  }
});

const form      = document.getElementById("loginForm");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("emailIn").value.trim();
  const pass  = document.getElementById("passIn").value;

  submitBtn.disabled = true;
  submitBtn.textContent = "Signing in…";

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    // onAuthStateChanged above will redirect once user resolves
  } catch (err) {
    alert(err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in";
  }
});

document.getElementById("forgotBtn").addEventListener("click", async () => {
  const email = document.getElementById("emailIn").value.trim();
  if (!email) { alert("Enter your email address first, then click Forgot password."); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    alert("Password reset email sent! Check your inbox.");
  } catch (err) {
    alert(err.message);
  }
});
</script>
</body>
</html>
