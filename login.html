<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Log In • ShadowMed</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--bg:#050816;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050816;
font-family:'Inter',sans-serif;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(139,92,246,.25), transparent 30%),
radial-gradient(circle at 80% 20%, rgba(6,182,212,.2), transparent 30%),
radial-gradient(circle at 50% 80%, rgba(236,72,153,.2), transparent 30%);
z-index:-2;
}

.auth-card{
width:min(500px,90%);
padding:3rem;
border-radius:32px;

background:
linear-gradient(#0b1020,#0b1020) padding-box,
linear-gradient(
135deg,
#8b5cf6,
#06b6d4,
#ec4899
) border-box;

border:1px solid transparent;
backdrop-filter:blur(20px);
}

.logo{
font-family:'Space Grotesk';
font-size:2rem;
font-weight:700;
text-align:center;
margin-bottom:.5rem;
}

.logo span{
background:linear-gradient(135deg,#8b5cf6,#06b6d4);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
text-align:center;
color:#b7bfd3;
margin-bottom:2rem;
}

input{
width:100%;
padding:1rem;
margin-bottom:1rem;
border-radius:14px;
border:1px solid rgba(255,255,255,.1);
background:rgba(255,255,255,.04);
color:white;
outline:none;
}

input:focus{
border-color:#8b5cf6;
}

.btn{
width:100%;
padding:1rem;
border:none;
border-radius:999px;
background:linear-gradient(
135deg,
#8b5cf6,
#06b6d4
);
color:white;
font-weight:600;
cursor:pointer;
}

.auth-footer{
margin-top:1.5rem;
text-align:center;
color:#b7bfd3;
}

.auth-footer a{
color:#8b5cf6;
text-decoration:none;
}

</style>

</head>

<body>

<div class="auth-card">

<div class="logo">
Shadow<span>Med</span>
</div>

<p class="subtitle">
Welcome back.
</p>

<form>

<input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Password" required>

<button class="btn">
Log In
</button>

</form>

<div class="auth-footer">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</div>

</body>
</html>
