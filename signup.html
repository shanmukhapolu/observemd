<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ObserveMD • Sign Up</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --panel:rgba(255,255,255,.03);
    --border:rgba(255,255,255,.08);
    --muted:#94a3b8;

    --purple:#8b5cf6;
    --cyan:#06b6d4;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:2rem;

    background:#050816;
    color:white;
    font-family:'Inter',sans-serif;
    overflow:hidden;
}

/* background glow */
body::before{
    content:'';
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at 15% 20%, rgba(139,92,246,.18), transparent 35%),
    radial-gradient(circle at 85% 25%, rgba(6,182,212,.12), transparent 35%),
    radial-gradient(circle at 50% 90%, rgba(139,92,246,.10), transparent 40%);

    z-index:-2;
}

.auth-shell{
    width:min(1050px,100%);
    height:650px;

    display:grid;
    grid-template-columns:1.1fr .9fr;

    border-radius:32px;
    overflow:hidden;

    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(20px);

    box-shadow:0 40px 90px rgba(0,0,0,.5);
}

/* LEFT PANEL */
.left{
    padding:4rem;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(139,92,246,.22), transparent 70%);
}

.logo{
    font-family:'Space Grotesk';
    font-size:1.4rem;
    font-weight:700;
    margin-bottom:2rem;
    position:relative;
}

.logo span{
    background:linear-gradient(135deg,var(--purple),var(--cyan));
    -webkit-background-clip:text;
    color:transparent;
}

.left h1{
    font-family:'Space Grotesk';
    font-size:3.6rem;
    line-height:1;
    margin-bottom:1.5rem;
    position:relative;
}

.left p{
    color:var(--muted);
    max-width:420px;
    line-height:1.7;
    font-size:1.05rem;
    position:relative;
}

.features{
    margin-top:2rem;
    display:flex;
    flex-direction:column;
    gap:.8rem;
    position:relative;
    color:#cbd5e1;
}

.features div::before{
    content:"✓";
    color:#86efac;
    margin-right:.6rem;
}

/* RIGHT PANEL */
.right{
    padding:3rem;
    display:flex;
    flex-direction:column;
    justify-content:center;

    background:rgba(255,255,255,.02);
    border-left:1px solid rgba(255,255,255,.06);
}

.right h2{
    font-family:'Space Grotesk';
    font-size:2rem;
    margin-bottom:.5rem;
}

.right p{
    color:var(--muted);
    margin-bottom:1.5rem;
}

.right p a{
    color:#c4b5fd;
    text-decoration:none;
}

/* INPUTS */
input{
    width:100%;
    height:52px;
    margin-bottom:.8rem;

    padding:0 1rem;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.03);

    color:white;
    outline:none;

    transition:.2s;
}

input:focus{
    border-color:var(--purple);
    box-shadow:0 0 0 4px rgba(139,92,246,.12);
}

input::placeholder{
    color:#7c879a;
}

/* BUTTON */
.btn{
    width:100%;
    height:54px;

    margin-top:.5rem;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,var(--purple),var(--cyan));
    color:white;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(139,92,246,.3);
}

/* GOOGLE BUTTON */
.google{
    width:100%;
    height:52px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.03);

    color:white;

    cursor:pointer;

    margin-bottom:1rem;
}

.google:hover{
    background:rgba(255,255,255,.05);
}

/* DIVIDER */
.divider{
    display:flex;
    align-items:center;
    margin:1.2rem 0;
    color:#64748b;
    font-size:.85rem;
}

.divider::before,
.divider::after{
    content:'';
    flex:1;
    height:1px;
    background:rgba(255,255,255,.08);
}

.divider span{
    padding:0 1rem;
}

/* RESPONSIVE */
@media(max-width:900px){
    .auth-shell{
        grid-template-columns:1fr;
        height:auto;
    }

    .left{
        display:none;
    }

    .right{
        border-left:none;
    }
}

</style>
</head>

<body>

<div class="auth-shell">

    <!-- LEFT SIDE -->
    <div class="left">

        <div class="logo">
            Observe<span>MD</span>
        </div>

        <h1>
            Everything you've observed.<br>One place.
        </h1>

        <p>
            Track shadowing hours, specialties, reflections, and clinical exposure without scattered notes or spreadsheets.
        </p>

        <div class="features">
            <div>Track clinical hours</div>
            <div>Organize experiences</div>
            <div>Export for applications</div>
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <h2>Create account</h2>
        <p>
            Already have an account? <a href="login.html">Sign in</a>
        </p>

        <button class="google">Continue with Google</button>

        <div class="divider"><span>or</span></div>

        <form>

            <input type="text" placeholder="Full name" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm password" required>

            <button class="btn" type="submit">
                Create account
            </button>

        </form>

    </div>

</div>

</body>
</html>
