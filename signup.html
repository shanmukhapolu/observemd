<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up • ObserveMD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --card:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.08);
    --text:#ffffff;
    --muted:#aeb6c9;

    --purple:#8b5cf6;
    --cyan:#06b6d4;
    --pink:#ec4899;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Inter',sans-serif;
    color:white;
    background:#050816;
    overflow:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 15% 20%, rgba(139,92,246,.25), transparent 35%),
    radial-gradient(circle at 85% 20%, rgba(6,182,212,.18), transparent 35%),
    radial-gradient(circle at 50% 90%, rgba(236,72,153,.15), transparent 35%);
    z-index:-2;
}

.blur{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.25;
    z-index:-1;
}

.blur1{
    background:#8b5cf6;
    top:-150px;
    left:-150px;
}

.blur2{
    background:#06b6d4;
    bottom:-150px;
    right:-150px;
}

.auth-card{
    width:min(560px,92%);
    padding:3.5rem;
    border-radius:36px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.06),
        rgba(255,255,255,.03)
    );

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(40px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.badge{
    width:max-content;
    margin:auto;
    margin-bottom:1rem;

    padding:.55rem 1rem;

    border-radius:999px;

    background:rgba(139,92,246,.15);

    border:1px solid rgba(139,92,246,.25);

    color:#c4b5fd;

    font-size:.85rem;
    font-weight:600;
}

.logo{
    font-family:'Space Grotesk',sans-serif;
    font-size:2.4rem;
    font-weight:700;
    text-align:center;
    margin-bottom:.75rem;
}

.logo span{
    background:linear-gradient(
        135deg,
        var(--purple),
        var(--cyan)
    );

    -webkit-background-clip:text;
    color:transparent;
}

h1{
    text-align:center;
    font-family:'Space Grotesk';
    font-size:2.5rem;
    line-height:1.1;
    margin-bottom:1rem;
}

.subtitle{
    text-align:center;
    color:var(--muted);

    max-width:420px;
    margin:0 auto 2rem;

    line-height:1.7;
}

.social-btn{
    width:100%;
    height:58px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.04);

    color:white;

    font-size:.95rem;
    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.social-btn:hover{
    background:rgba(255,255,255,.07);
    transform:translateY(-2px);
}

.divider{
    position:relative;
    text-align:center;
    margin:1.8rem 0;
}

.divider::before{
    content:'';
    position:absolute;
    left:0;
    top:50%;
    width:100%;
    height:1px;
    background:rgba(255,255,255,.08);
}

.divider span{
    position:relative;
    background:#0b1020;
    padding:0 1rem;
    color:var(--muted);
    font-size:.9rem;
}

.form-group{
    margin-bottom:1rem;
}

input{
    width:100%;
    height:58px;

    padding:0 1rem;

    border-radius:18px;

    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.08);

    color:white;

    outline:none;

    font-size:15px;

    transition:.25s;
}

input::placeholder{
    color:#8f99af;
}

input:focus{
    border-color:var(--purple);

    box-shadow:
        0 0 0 4px rgba(139,92,246,.15);

    background:
        rgba(255,255,255,.05);
}

.btn{
    width:100%;
    height:58px;

    margin-top:1rem;

    border:none;
    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #8b5cf6,
        #6d7cff,
        #06b6d4
    );

    color:white;

    font-size:1rem;
    font-weight:700;

    cursor:pointer;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 35px rgba(139,92,246,.35);
}

.auth-footer{
    margin-top:1.8rem;
    text-align:center;
    color:var(--muted);
}

.auth-footer a{
    color:#c4b5fd;
    text-decoration:none;
    font-weight:600;
}

.auth-footer a:hover{
    color:white;
}

@media(max-width:600px){

.auth-card{
    padding:2rem;
}

h1{
    font-size:2rem;
}

.logo{
    font-size:2rem;
}

}

</style>
</head>

<body>

<div class="blur blur1"></div>
<div class="blur blur2"></div>

<div class="auth-card">

    <div class="badge">
        Free Forever
    </div>

    <div class="logo">
        Observe<span>MD</span>
    </div>

    <h1>
        Start your clinical journey.
    </h1>

    <p class="subtitle">
        Track shadowing hours, reflections, specialties, and experiences in one place.
    </p>

    <button class="social-btn" type="button">
        Continue with Google
    </button>

    <div class="divider">
        <span>or continue with email</span>
    </div>

    <form>

        <div class="form-group">
            <input
                type="text"
                placeholder="Full Name"
                required>
        </div>

        <div class="form-group">
            <input
                type="email"
                placeholder="Email Address"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                placeholder="Password"
                required>
        </div>

        <div class="form-group">
            <input
                type="password"
                placeholder="Confirm Password"
                required>
        </div>

        <button class="btn" type="submit">
            Create Account
        </button>

    </form>

    <div class="auth-footer">
        Already have an account?
        <a href="login.html">Log In</a>
    </div>

</div>

</body>
</html>
